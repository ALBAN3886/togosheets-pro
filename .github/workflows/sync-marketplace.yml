name: Sync vers togosheets-marketplace

on:
  push:
    branches: [main]
    paths:
      - 'public.html'
      - 'boutique.html'
      - 'employe.html'
      - 'manifest-employe.json'
      - 'sw-employe.js'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'images/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout togosheets-pro
        uses: actions/checkout@v4

      - name: Checkout togosheets-marketplace
        uses: actions/checkout@v4
        with:
          repository: alban3886/togosheets-marketplace
          token: ${{ secrets.MARKETPLACE_SYNC_TOKEN }}
          path: marketplace

      - name: Copier les fichiers partagés
        run: |
          sed 's|href="index.html"|href="https://alban3886.github.io/togosheets-pro/"|g' \
            public.html > marketplace/index.html
          cp boutique.html employe.html manifest-employe.json sw-employe.js \
             icon-192.png icon-512.png marketplace/
          mkdir -p marketplace/images
          rsync -a --delete images/ marketplace/images/

      - name: Commit + push si changement
        working-directory: marketplace
        run: |
          git config user.name  "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien à synchroniser."
          else
            git commit -m "Sync auto depuis togosheets-pro@${GITHUB_SHA::7}"
            git push
          fi
