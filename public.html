<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TogoSheets Pro — Marketplace</title>
<meta name="description" content="Découvrez toutes les boutiques en ligne propulsées par AET Technology">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --primary:#10b981;--primary-d:#059669;--primary-rgb:16,185,129;
  --bg:#f8fafc;--card:#fff;--border:#e2e8f0;--text:#1e293b;
  --muted:#64748b;--radius:16px;--shadow:0 2px 12px rgba(0,0,0,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── Header ── */
.header{background:linear-gradient(135deg,#059669,#10b981 50%,#34d399);padding:0 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(16,185,129,.3)}
.header-inner{max-width:700px;margin:0 auto;display:flex;align-items:center;gap:12px;height:56px}
.header-logo{width:36px;height:36px;background:#fff;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:13px;color:var(--primary);flex-shrink:0}
.header-title{color:#fff;font-weight:800;font-size:17px;flex:1}
.header-sub{color:rgba(255,255,255,.8);font-size:11px}
.header-btn{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:10px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.header-btn:hover{background:rgba(255,255,255,.3)}

/* ── Hero ── */
.hero{background:linear-gradient(135deg,#ecfdf5,#f0fdf4);padding:24px 16px 16px;text-align:center;border-bottom:1px solid var(--border)}
.hero h1{font-size:22px;font-weight:900;color:var(--text);margin-bottom:6px}
.hero p{color:var(--muted);font-size:13px;margin-bottom:16px}
.hero-stats{display:flex;justify-content:center;gap:24px}
.hero-stat{text-align:center}
.hero-stat-n{font-size:22px;font-weight:900;color:var(--primary)}
.hero-stat-l{font-size:11px;color:var(--muted)}

/* ── Search & Filters ── */
.search-wrap{max-width:700px;margin:16px auto;padding:0 16px}
.search-box{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow)}
.search-box i{color:var(--muted)}
.search-box input{border:none;outline:none;flex:1;font-size:14px;background:transparent;color:var(--text)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter-chip{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ── Sort bar ── */
.sort-bar{max-width:700px;margin:0 auto;padding:0 16px 8px;display:flex;align-items:center;justify-content:space-between}
.sort-bar span{font-size:13px;color:var(--muted)}
.sort-select{border:1.5px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;background:var(--card);color:var(--text);cursor:pointer}

/* ── Grid boutiques ── */
.grid{max-width:700px;margin:0 auto;padding:0 16px 100px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(min-width:480px){.grid{grid-template-columns:repeat(2,1fr)}}

/* ── Carte boutique ── */
.shop-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .2s;box-shadow:var(--shadow)}
.shop-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.12);border-color:var(--primary)}
.shop-banner{height:90px;background:linear-gradient(135deg,#ecfdf5,#d1fae5);display:grid;place-items:center;position:relative;overflow:hidden}
.shop-banner img{width:100%;height:100%;object-fit:cover}
.shop-banner-icon{font-size:36px}
.shop-badge-new{position:absolute;top:8px;right:8px;background:#f59e0b;color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px}
.shop-badge-top{position:absolute;top:8px;right:8px;background:#ef4444;color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:5px}
.shop-logo{width:44px;height:44px;border-radius:12px;border:3px solid var(--card);background:var(--primary);display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px;position:absolute;bottom:-18px;left:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.shop-logo img{width:100%;height:100%;object-fit:cover}
.shop-body{padding:24px 12px 12px}
.shop-name{font-size:14px;font-weight:800;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop-type{font-size:11px;color:var(--primary);font-weight:600;margin-bottom:4px}
.shop-location{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-bottom:8px}
.shop-stats{display:flex;gap:8px;font-size:11px;color:var(--muted)}
.shop-stat{display:flex;align-items:center;gap:3px}
.shop-stat i{font-size:10px;color:var(--primary)}
.shop-btn{width:100%;margin-top:10px;padding:8px;background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;border:none;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer}

/* ── Empty / Loading ── */
.empty{grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--muted)}
.empty i{font-size:48px;margin-bottom:12px;display:block;opacity:.3}
.loader{display:flex;justify-content:center;align-items:center;height:200px;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--primary);animation:bounce .8s infinite alternate}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{to{transform:translateY(-14px);opacity:.5}}

/* ── Footer ── */
.footer{background:var(--card);border-top:1px solid var(--border);padding:16px;text-align:center;font-size:12px;color:var(--muted)}
.footer a{color:var(--primary);text-decoration:none;font-weight:600}

/* ── Modal boutique detail ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end}
.overlay.open{display:flex}
.drawer{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:20px 16px 40px}
.drawer-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.drawer-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.drawer-logo{width:56px;height:56px;border-radius:14px;overflow:hidden;background:var(--primary);display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px;flex-shrink:0}
.drawer-logo img{width:100%;height:100%;object-fit:cover}
.drawer-name{font-size:18px;font-weight:900}
.drawer-type{font-size:12px;color:var(--primary);font-weight:600}
.drawer-desc{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.6}
.drawer-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.meta-item{background:var(--bg);border-radius:10px;padding:10px}
.meta-label{font-size:10px;color:var(--muted);margin-bottom:2px}
.meta-val{font-size:13px;font-weight:700}
.drawer-products{margin-bottom:16px}
.drawer-products h4{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.mini-products{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini-product{background:var(--bg);border-radius:10px;overflow:hidden;text-align:center}
.mini-product-img{height:60px;background:linear-gradient(135deg,#ecfdf5,#d1fae5);display:grid;place-items:center;font-size:24px}
.mini-product-img img{width:100%;height:100%;object-fit:cover}
.mini-product-name{font-size:10px;font-weight:600;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-product-price{font-size:10px;color:var(--primary);font-weight:700;padding:0 6px 4px}
.btn-visit{width:100%;padding:14px;background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;margin-top:4px}
.btn-close{position:absolute;top:16px;right:16px;background:var(--bg);border:none;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}

/* ── Toast ── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}

/* ═══════════ NAVIGATION MARKETPLACE MODERNE ═══════════ */
html{
  scroll-behavior:smooth;
  scroll-padding-top:82px;
}

body{
  -webkit-tap-highlight-color:transparent;
}

.header{
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.header-inner{
  max-width:1100px;
  height:68px;
}

.market-brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
  padding:0;
  border:0;
  background:transparent;
  color:inherit;
  text-align:left;
  font-family:inherit;
  cursor:pointer;
}

.market-brand-text{
  min-width:0;
}

.desktop-nav{
  display:flex;
  align-items:center;
  gap:4px;
  margin-left:auto;
}

.desktop-nav-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:40px;
  padding:0 13px;
  border:1px solid transparent;
  border-radius:12px;
  background:transparent;
  color:rgba(255,255,255,.88);
  font-family:inherit;
  font-size:12px;
  font-weight:750;
  text-decoration:none;
  white-space:nowrap;
  cursor:pointer;
  transition:
    background .2s ease,
    color .2s ease,
    border-color .2s ease,
    transform .2s ease;
}

.desktop-nav-btn:hover{
  color:#fff;
  background:rgba(255,255,255,.15);
  border-color:rgba(255,255,255,.14);
  transform:translateY(-1px);
}

.desktop-nav-btn.active{
  color:#047857;
  background:#fff;
  box-shadow:0 8px 22px rgba(6,78,59,.18);
}

.desktop-space-btn{
  margin-left:6px;
  color:#fff;
  background:rgba(255,255,255,.16);
  border-color:rgba(255,255,255,.20);
}

/* Barre de navigation mobile */
.mobile-nav{
  position:fixed;
  left:50%;
  bottom:0;
  z-index:180;
  display:none;
  width:100%;
  max-width:540px;
  min-height:68px;
  padding:7px 7px calc(7px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  background:rgba(255,255,255,.96);
  border-top:1px solid rgba(226,232,240,.95);
  box-shadow:0 -12px 32px rgba(15,23,42,.12);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.mobile-nav-item{
  position:relative;
  flex:1;
  min-width:0;
  min-height:52px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  padding:0 2px;
  border:0;
  border-radius:14px;
  background:transparent;
  color:#64748b;
  font-family:inherit;
  font-size:9.5px;
  font-weight:750;
  text-decoration:none;
  cursor:pointer;
  transition:
    color .2s ease,
    background .2s ease,
    transform .15s ease;
}

.mobile-nav-item i{
  font-size:18px;
  transition:transform .2s ease;
}

.mobile-nav-item:active{
  transform:scale(.94);
}

.mobile-nav-item.active{
  color:var(--primary-d);
  background:rgba(var(--primary-rgb),.10);
}

.mobile-nav-item.active i{
  transform:translateY(-1px);
}

.mobile-nav-item.active::before{
  content:"";
  position:absolute;
  top:3px;
  width:22px;
  height:3px;
  border-radius:999px;
  background:var(--primary);
}

.market-section{
  scroll-margin-top:84px;
}

.filters.nav-highlight,
.search-box.nav-highlight{
  animation:marketNavHighlight 1.25s ease;
}

@keyframes marketNavHighlight{
  0%,100%{
    box-shadow:var(--shadow);
  }
  35%{
    box-shadow:
      0 0 0 5px rgba(var(--primary-rgb),.14),
      0 12px 30px rgba(16,185,129,.18);
  }
}

/* Grands écrans */
@media(min-width:900px){
  .search-wrap,
  .sort-bar,
  .grid{
    max-width:1100px;
  }

  .grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:18px;
  }

  .shop-banner{
    height:130px;
  }

  .hero{
    padding-top:34px;
    padding-bottom:24px;
  }

  .hero h1{
    font-size:30px;
  }

  .hero p{
    font-size:14px;
  }
}

/* Tablettes */
@media(max-width:860px) and (min-width:701px){
  .desktop-nav-btn span{
    display:none;
  }

  .desktop-nav-btn{
    width:40px;
    padding:0;
  }
}

/* Téléphones */
@media(max-width:700px){
  body{
    padding-bottom:calc(74px + env(safe-area-inset-bottom));
  }

  .header-inner{
    height:60px;
  }

  .desktop-nav{
    display:none;
  }

  .mobile-nav{
    display:flex;
  }

  .header-title{
    font-size:15px;
  }

  .header-sub{
    font-size:10px;
  }

  .hero{
    padding-top:20px;
  }

  .hero h1{
    font-size:21px;
  }

  .footer{
    padding-bottom:24px;
  }

  .toast{
    bottom:calc(88px + env(safe-area-inset-bottom));
  }

  .drawer{
    padding-bottom:calc(88px + env(safe-area-inset-bottom));
  }
}

@media(max-width:380px){
  .mobile-nav-item{
    font-size:8.5px;
  }

  .mobile-nav-item i{
    font-size:17px;
  }

  .header-logo{
    width:34px;
    height:34px;
  }
}

@media(prefers-reduced-motion:reduce){
  html{
    scroll-behavior:auto;
  }

  .desktop-nav-btn,
  .mobile-nav-item,
  .mobile-nav-item i{
    transition:none;
  }
}


/* ── Marketplace simplifiée : menu Boutiques uniquement ── */
.sort-bar {
  justify-content: flex-end !important;
}

#resultCount {
  display: none !important;
}

.mobile-nav {
  display: none !important;
}

.market-brand {
  appearance: none;
  border: 0;
  background: transparent;
  display: flex;
  align-items: center;
  gap: 11px;
  flex: 1;
  min-width: 0;
  padding: 0;
  text-align: left;
  cursor: pointer;
  font-family: inherit;
}

.market-brand-copy {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

@media (max-width: 700px) {
  body {
    padding-bottom: 0 !important;
  }

  .header-inner {
    height: 64px;
  }

  .desktop-nav {
    display: flex !important;
    flex-shrink: 0;
  }

  .desktop-nav-btn {
    width: auto !important;
    min-width: 0;
    padding: 9px 12px !important;
  }

  .desktop-nav-btn span {
    display: inline !important;
  }
}

@media (max-width: 420px) {
  .header-title {
    font-size: 14px;
  }

  .header-sub {
    font-size: 9px;
  }

  .desktop-nav-btn {
    padding: 9px 10px !important;
  }
}

</style>

<style id="category-images-style">

<body>

<!-- Header simplifié Marketplace -->
<header class="header">
  <div class="header-inner">
    <button
      type="button"
      class="market-brand"
      onclick="marketplaceNavigate('shops')"
      aria-label="Afficher les boutiques">
      <span class="header-logo">AET</span>
      <span class="market-brand-copy">
        <span class="header-title">Marketplace TogoSheets</span>
        <span class="header-sub">Toutes les boutiques en ligne</span>
      </span>

    <nav class="desktop-nav" aria-label="Navigation Marketplace">
      <button

        class="desktop-nav-btn active"

  </div>
</header>

<!-- Search -->

    <div class="filter-chip" data-cat="vetement" onclick="pickCat(this)">
      <img src="images/categories/vetement.jpg" alt="">
      <span>Vêtements</span>
    </div>
    <div class="filter-chip" data-cat="beaute" onclick="pickCat(this)">
      <img src="images/categories/beaute.jpg" alt="">
      <span>Beauté</span>
    </div>
    <div class="filter-chip" data-cat="maison" onclick="pickCat(this)">
      <img src="images/categories/maison.jpg" alt="">
      <span>Maison</span>

      <span>Santé</span>
    </div>
    <div class="filter-chip" data-cat="service" onclick="pickCat(this)">
      <img src="images/categories/service.jpg" alt="">
      <span>Services</span>
    </div>
    <div class="filter-chip" data-cat="autre" onclick="pickCat(this)">

</div>

<!-- Sort bar -->
<div class="sort-bar">
  <span id="resultCount">Chargement…</span>
  <select class="sort-select" id="sortSelect" onchange="applyFilters()">
    <option value="recent">Plus récentes</option>
    <option value="products">Plus de produits</option>
    <option value="alpha">A → Z</option>
  </select>
</div>

<!-- Grid -->
<div class="grid market-section" id="shopsGrid">
  <div class="loader" style="grid-column:1/-1">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
</div>

<!-- Drawer détail boutique -->
<div class="overlay" id="shopOverlay" onclick="closeDrawer(event)">
  <div class="drawer" id="shopDrawer">
    <div class="drawer-handle"></div>
    <button class="btn-close" onclick="closeShopDrawer()"><i class="fas fa-times"></i></button>
    <div id="drawerContent"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Footer -->
<div class="footer">
  Propulsé par <a href="index.html">AET Technology</a> — Lomé, Togo 🇹🇬<br>
  <span style="margin-top:4px;display:block">Vous avez une boutique ? <a href="index.html">Créez la vôtre gratuitement</a></span>

};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ── Icônes par type de boutique ──
const TYPE_IMAGES = {
  alimentaire: 'images/categories/alimentaire.jpg',
  electronique: 'images/categories/electronique.jpg',
  vetement: 'images/categories/vetement.jpg',
  beaute: 'images/categories/beaute.jpg',
  maison: 'images/categories/maison.jpg',
  sante: 'images/categories/sante.jpg',
  service: 'images/categories/service.jpg',
  pharmacie: 'images/categories/pharmacie.jpg',
  librairie: 'images/categories/librairie.jpg',
  informatique: 'images/categories/informatique.jpg',
  telephone: 'images/categories/telephone.jpg',
  automobile: 'images/categories/automobile.jpg',
  agriculture: 'images/categories/agriculture.jpg',
  artisanat: 'images/categories/artisanat.jpg',
  bijouterie: 'images/categories/bijouterie.jpg',
  sport: 'images/categories/sport.jpg',
  autre: 'images/categories/autre.jpg'
};

const DEFAULT_CATEGORY_IMAGE = 'images/categories/autre.jpg';

function getCategoryImage(type) {
  return TYPE_IMAGES[type] || DEFAULT_CATEGORY_IMAGE;
}
const TYPE_LABELS = {
  alimentaire:'Alimentation', electronique:'Électronique', vetement:'Vêtements',
  beaute:'Beauté & Cosmétiques', maison:'Maison & Déco', sante:'Santé',
  pharmacie:'Pharmacie', librairie:'Librairie', informatique:'Informatique',
  telephone:'Téléphonie', automobile:'Automobile', agriculture:'Agriculture',
  artisanat:'Artisanat', bijouterie:'Bijouterie', sport:'Sport', service:'Services', autre:'Autre'
};

// Couleurs de fond par type
const TYPE_BG = {
  alimentaire:'linear-gradient(135deg,#ecfdf5,#d1fae5)',
  electronique:'linear-gradient(135deg,#eff6ff,#dbeafe)',
  vetement:'linear-gradient(135deg,#fdf4ff,#f3e8ff)',
  beaute:'linear-gradient(135deg,#fff1f2,#ffe4e6)',
  maison:'linear-gradient(135deg,#fffbeb,#fef3c7)',
  sante:'linear-gradient(135deg,#ecfdf5,#d1fae5)',
  service:'linear-gradient(135deg,#f0f9ff,#e0f2fe)',
  autre:'linear-gradient(135deg,#f8fafc,#f1f5f9)'
};

window._allShops = [];
window._currentCat = 'all';

let marketplaceNavLockUntil = 0;

function setMarketplaceNavActive(target) {
  // Le menu Marketplace ne contient désormais que « Boutiques ».
  target = 'shops';
  document.querySelectorAll('[data-market-nav]').forEach(el => {
    const active = el.dataset.marketNav === target;
    el.classList.toggle('active', active);
    if (active) el.setAttribute('aria-current', 'page');
    else el.removeAttribute('aria-current');
  });
}

function highlightMarketplaceElement(el) {
  if (!el) return;
  el.classList.remove('nav-highlight');
  void el.offsetWidth;
  el.classList.add('nav-highlight');
  setTimeout(() => el.classList.remove('nav-highlight'), 1200);
}

window.marketplaceNavigate = function(target) {
  marketplaceNavLockUntil = Date.now() + 1000;
  setMarketplaceNavActive(target);

  if (target === 'home') {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  if (target === 'shops') {
    document.getElementById('shopsGrid')?.scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });
    return;
  }

  if (target === 'categories') {
    const filters = document.getElementById('filtersBar');
    filters?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    highlightMarketplaceElement(filters);
    return;
  }

  if (target === 'search') {
    const section = document.getElementById('marketSearch');
    const input = document.getElementById('searchInput');
    section?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    highlightMarketplaceElement(section?.querySelector('.search-box'));

    setTimeout(() => {
      input?.focus({ preventScroll: true });
    }, 450);
  }
};

function updateMarketplaceNavOnScroll() {
  if (Date.now() < marketplaceNavLockUntil) return;

  const grid = document.getElementById('shopsGrid');
  if (grid && grid.getBoundingClientRect().top < window.innerHeight * 0.55) {
    setMarketplaceNavActive('shops');
  } else {
    setMarketplaceNavActive('home');
  }
}

window.addEventListener('scroll', updateMarketplaceNavOnScroll, {
  passive: true
});

document.getElementById('searchInput')?.addEventListener('focus', () => {
  setMarketplaceNavActive('search');
});

// ── Charge toutes les boutiques ──
async function loadShops(){
  try {
    const snap = await getDocs(collection(db, 'public_shops'));
    const shops = [];
    let totalProducts = 0;
    const cities = new Set();

    snap.forEach(docSnap => {
      const data = docSnap.data();
      const uid  = docSnap.id;
      // Ignorer les comptes sans boutique publique activée
      if(!data.shops || !data.shops.length) return;

      data.shops.forEach(shop => {
        // Uniquement les boutiques marquées publiques (ou toutes si pas de flag)
        if(shop.isPublic === false) return;

        const articles = (data.articles||[]).filter(a => a.shopId === shop.id);
        totalProducts += articles.length;
        if(shop.city) cities.add(shop.city);

        shops.push({
          uid,
          shopId:    shop.id,
          name:      shop.name || 'Boutique sans nom',
          type:      shop.type || 'autre',
          customType:shop.customType || '',
          city:      shop.city || '',
          country:   shop.country || 'Togo',
          addr:      shop.addr || '',
          logo:      shop.logoUrl || (shop.branding && shop.branding.logoUrl) || '',
          banner:    (shop.branding && shop.branding.bgUrl) || '',
          slogan:    (shop.branding && shop.branding.slogan) || '',
          articles,
          createdAt: shop.createdAt || 0,
          isNew:     (Date.now() - (shop.createdAt||0)) < 7*24*3600*1000
        });
      });
    });

    window._allShops = shops;

    applyFilters();
  } catch(e){
    console.error(e);
    document.getElementById('shopsGrid').innerHTML =
      '<div class="empty" style="grid-column:1/-1"><i class="fas fa-wifi-slash"></i><p>Erreur de chargement. Vérifiez votre connexion.</p></div>';
  }
}

window.applyFilters = function(){
  const term  = (document.getElementById('searchInput').value||'').toLowerCase();
  const cat   = window._currentCat || 'all';
  const sort  = document.getElementById('sortSelect').value;

  let list = window._allShops.slice();

  // Filtre catégorie
  if(cat !== 'all') list = list.filter(s => s.type === cat || s.customType === cat);

  // Recherche texte
  if(term) list = list.filter(s =>
    s.name.toLowerCase().includes(term) ||
    s.city.toLowerCase().includes(term) ||
    s.slogan.toLowerCase().includes(term) ||
    s.articles.some(a => (a.name||'').toLowerCase().includes(term))
  );

  // Tri
  if(sort === 'recent')   list.sort((a,b) => b.createdAt - a.createdAt);
  if(sort === 'products') list.sort((a,b) => b.articles.length - a.articles.length);
  if(sort === 'alpha')    list.sort((a,b) => a.name.localeCompare(b.name));

  document.getElementById('resultCount').textContent =
    list.length ? `${list.length} boutique${list.length>1?'s':''}` : 'Aucune boutique';

  renderShops(list);
};

function renderShops(list){
  const grid = document.getElementById('shopsGrid');
  if(!list.length){
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><i class="fas fa-store-slash"></i><p>Aucune boutique trouvée</p></div>';
    return;
  }
  grid.innerHTML = list.map(s => {
    const icon = `<img class="type-category-img" src="${getCategoryImage(s.type)}" alt="" loading="lazy" onerror="this.onerror=null;this.src=DEFAULT_CATEGORY_IMAGE">`;
    const label  = s.customType || TYPE_LABELS[s.type] || 'Boutique';
    const bg     = TYPE_BG[s.type] || TYPE_BG.autre;
    const loc    = [s.city, s.country].filter(Boolean).join(', ') || 'Togo';
    const nbArt  = s.articles.length;
    // Miniature image du 1er article
    const firstImg = s.articles.find(a => a.imageUrl)?.imageUrl || '';

    return `
    <div class="shop-card" onclick="openShop('${esc(s.uid)}','${esc(s.shopId)}')">
      <div class="shop-banner" style="background:${bg}">
        ${s.banner ? `<img src="${esc(s.banner)}" alt="">` :
          firstImg  ? `<img src="${esc(firstImg)}" alt="">` :
          `<span class="shop-banner-icon">${icon}</span>`}
        ${s.isNew ? '<span class="shop-badge-new">NOUVEAU</span>' : ''}
        <div class="shop-logo">
          ${s.logo ? `<img src="${esc(s.logo)}" alt="">` : esc((s.name||'B').slice(0,2).toUpperCase())}
        </div>
      </div>
      <div class="shop-body">
        <div class="shop-name">${esc(s.name)}</div>
        <div class="shop-type">${icon} ${esc(label)}</div>
        <div class="shop-location"><i class="fas fa-location-dot"></i>${esc(loc)}</div>
        <div class="shop-stats">
          ${s.slogan ? `<div class="shop-stat" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px" title="${esc(s.slogan)}"><i class="fas fa-quote-left"></i>${esc(s.slogan.slice(0,30))}…</div>` : ''}
        </div>
        <button class="shop-btn">Visiter la boutique →</button>
      </div>
    </div>`;
  }).join('');
}

window.openShop = function(uid, shopId){
  const s = window._allShops.find(x => x.uid === uid && x.shopId === shopId);
  if(!s) return;
  const icon = `<img class="type-category-img" src="${getCategoryImage(s.type)}" alt="" loading="lazy" onerror="this.onerror=null;this.src=DEFAULT_CATEGORY_IMAGE">`;
  const label = s.customType || TYPE_LABELS[s.type] || 'Boutique';
  const loc   = [s.addr, s.city, s.country].filter(Boolean).join(' • ') || 'Togo';
  const bg    = TYPE_BG[s.type] || TYPE_BG.autre;

  const miniProds = '';

  document.getElementById('drawerContent').innerHTML = `
    <div class="drawer-header">
      <div class="drawer-logo" style="background:${bg}">
        ${s.logo ? `<img src="${esc(s.logo)}" alt="">` : `<span style="color:var(--text)">${esc((s.name||'B').slice(0,2).toUpperCase())}</span>`}
      </div>
      <div>
        <div class="drawer-name">${esc(s.name)}</div>
        <div class="drawer-type">${icon} ${esc(label)}</div>
      </div>
    </div>
    ${s.slogan ? `<div class="drawer-desc">"${esc(s.slogan)}"</div>` : ''}
    <div class="drawer-meta">
      <div class="meta-item">
        <div class="meta-label"><i class="fas fa-location-dot" style="margin-right:4px"></i>Localisation</div>
        <div class="meta-val">${esc(loc)}</div>
      </div>
      <div class="meta-item">
        <div class="meta-label"><i class="fas fa-box" style="margin-right:4px"></i>Produits</div>
        <div class="meta-val">${s.articles.length} article${s.articles.length>1?'s':''}</div>
      </div>
    </div>
    ${miniProds}
    <button class="btn-visit" onclick="visitShop('${esc(uid)}')">
      <i class="fas fa-store" style="margin-right:8px"></i>Ouvrir la boutique
    </button>
    <button style="width:100%;margin-top:8px;padding:12px;background:transparent;border:1.5px solid var(--border);border-radius:14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)" onclick="shareShop('${esc(uid)}','${esc(s.name)}')">
      <i class="fas fa-share-nodes" style="margin-right:6px"></i>Partager cette boutique
    </button>
  `;
  document.getElementById('shopOverlay').classList.add('open');
};

window.visitShop = function(uid){
  const base = window.location.origin + window.location.pathname.replace('public.html','');
  window.location.href = base + 'boutique.html?tenant=' + encodeURIComponent(uid);
};

window.shareShop = function(uid, name){
  const base = window.location.origin + window.location.pathname.replace('public.html','');
  const url  = base + 'boutique.html?tenant=' + encodeURIComponent(uid);
  if(navigator.share){
    navigator.share({ title: name, text: 'Visitez ' + name + ' sur TogoSheets Marketplace !', url });
  } else {
    navigator.clipboard.writeText(url).then(()=>showToast('Lien copié ! 📋'));
  }
};

window.closeShopDrawer = function(){
  document.getElementById('shopOverlay').classList.remove('open');
};
window.closeDrawer = function(e){
  if(e.target === document.getElementById('shopOverlay')) closeShopDrawer();
};

window.pickCat = function(el){
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  window._currentCat = el.dataset.cat;
  setMarketplaceNavActive('categories');
  marketplaceNavLockUntil = Date.now() + 800;
  applyFilters();
};
window.clearSearch = function(){
  document.getElementById('searchInput').value='';
  applyFilters();
};

function esc(s){ const d=document.createElement('div'); d.textContent=String(s||''); return d.innerHTML; }
function fmtPrice(n){ return Number(n||0).toLocaleString('fr-FR') + ' FCFA'; }
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

// Lancement
loadShops();
</script>
