<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Réinitialiser mon mot de passe — AET MonBudget</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="icon-192.png" type="image/png"/>
<style>
  :root{ --primary:#2563eb; --text:#0f172a; --muted:#64748b; --border:#e2e8f0; --bg:#f8fafc; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; background:linear-gradient(180deg,#eff6ff,#f8fafc); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; color:var(--text); }
  .card{ width:100%; max-width:400px; background:#fff; border-radius:24px; padding:28px 24px; box-shadow:0 20px 50px rgba(15,23,42,.10); border:1px solid var(--border); }
  .logo{ width:56px; height:56px; border-radius:16px; background:linear-gradient(135deg,var(--primary),#7c3aed); display:flex; align-items:center; justify-content:center; color:#fff; font-size:24px; margin:0 auto 16px; }
  h1{ font-size:20px; font-weight:900; text-align:center; margin:0 0 6px; }
  .sub{ font-size:13px; color:var(--muted); text-align:center; margin:0 0 22px; line-height:1.5; }
  label{ display:block; font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px; }
  .field{ margin-bottom:16px; position:relative; }
  input[type=password]{ width:100%; padding:12px 42px 12px 14px; border-radius:12px; border:1.5px solid var(--border); background:var(--bg); font-size:15px; color:var(--text); }
  input[type=password]:focus{ outline:none; border-color:var(--primary); }
  .eye{ position:absolute; right:12px; top:38px; cursor:pointer; color:var(--muted); background:none; border:none; font-size:15px; }
  .btn{ width:100%; padding:13px; border:none; border-radius:12px; background:linear-gradient(90deg,var(--primary),#7c3aed); color:#fff; font-weight:800; font-size:15px; cursor:pointer; }
  .btn:disabled{ opacity:.6; cursor:not-allowed; }
  .err{ color:#dc2626; font-size:12.5px; text-align:center; margin:0 0 14px; min-height:16px; }
  .icon-big{ width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:26px; margin:0 auto 16px; }
  .icon-big.ok{ background:#dcfce7; color:#16a34a; }
  .icon-big.ko{ background:#fee2e2; color:#dc2626; }
  .link-back{ display:block; text-align:center; margin-top:18px; color:var(--primary); font-weight:700; font-size:13.5px; text-decoration:none; }
  .loader{ display:flex; align-items:center; justify-content:center; padding:30px 0; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="loader">Vérification du lien…</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey:            "AIzaSyB5hpkRlFZ9HFRRbpQlvpHwMNDja37Nr2s",
      authDomain:        "gestion-salaire-9d3e9.firebaseapp.com",
      databaseURL:       "https://gestion-salaire-9d3e9-default-rtdb.firebaseio.com",
      projectId:         "gestion-salaire-9d3e9",
      storageBucket:     "gestion-salaire-9d3e9.firebasestorage.app",
      messagingSenderId: "1090226725870",
      appId:             "1:1090226725870:web:d16c25eb46397b3f2de4ff",
      measurementId:     "G-MJCB7XVY6D"
    };
    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const card = document.getElementById('card');
    const params = new URLSearchParams(location.search);
    // Retour après réinitialisation : si le lien vient d'une boutique (paramètre "back"
    // transmis par boutique.html), on y ramène le client ; sinon on garde l'accueil de l'app.
    const HOME = (() => {
      try {
        const c = params.get('continueUrl');
        const b = c ? new URL(c).searchParams.get('back') : params.get('back');
        if (b && b.startsWith('https://alban3886.github.io/')) return b;
      } catch (e) {}
      return 'index.html';
    })();
    const mode    = params.get('mode');
    const oobCode = params.get('oobCode');

    function renderError(message) {
      card.innerHTML = `
        <div class="icon-big ko">✕</div>
        <h1>Lien invalide</h1>
        <p class="sub">${message}</p>
        <a class="btn" href="${HOME}" style="display:block;text-decoration:none;text-align:center;line-height:1.4">Retour à l'accueil</a>
      `;
    }

    function renderAlreadyUsed() {
      card.innerHTML = `
        <div class="icon-big ok">✓</div>
        <h1>C'est déjà fait !</h1>
        <p class="sub">Ce lien a déjà été utilisé — ton mot de passe a très probablement déjà été changé avec succès. Retourne à l'accueil et connecte-toi avec ton nouveau mot de passe. Si ça ne fonctionne pas, redemande un nouveau lien depuis « Mot de passe oublié ».</p>
        <a class="btn" href="${HOME}" style="display:block;text-decoration:none;text-align:center;line-height:1.4">Retour à l'accueil</a>
      `;
    }

    function renderSuccess() {
      card.innerHTML = `
        <div class="icon-big ok">✓</div>
        <h1>Mot de passe changé ✔️</h1>
        <p class="sub">Ton mot de passe a été réinitialisé avec succès. Tu peux maintenant te connecter avec le nouveau.</p>
        <a class="btn" href="${HOME}" style="display:block;text-decoration:none;text-align:center;line-height:1.4">Retour à l'accueil</a>
      `;
    }

    function renderForm(email) {
      card.innerHTML = `
        <div class="logo">🔒</div>
        <h1>Nouveau mot de passe</h1>
        <p class="sub">Pour le compte <strong>${email}</strong></p>
        <p class="err" id="formErr"></p>
        <div class="field">
          <label>Nouveau mot de passe</label>
          <input type="password" id="pwd1" placeholder="Minimum 6 caractères" autocomplete="new-password">
          <button type="button" class="eye" data-target="pwd1">👁</button>
        </div>
        <div class="field">
          <label>Confirmer le mot de passe</label>
          <input type="password" id="pwd2" placeholder="Retape le mot de passe" autocomplete="new-password">
          <button type="button" class="eye" data-target="pwd2">👁</button>
        </div>
        <button class="btn" id="submitBtn">Changer mon mot de passe</button>
      `;

      card.querySelectorAll('.eye').forEach(btn => {
        btn.onclick = () => {
          const input = document.getElementById(btn.dataset.target);
          input.type = input.type === 'password' ? 'text' : 'password';
        };
      });

      document.getElementById('submitBtn').onclick = async () => {
        const pwd1 = document.getElementById('pwd1').value;
        const pwd2 = document.getElementById('pwd2').value;
        const errEl = document.getElementById('formErr');
        errEl.textContent = '';
        if (pwd1.length < 6) { errEl.textContent = 'Minimum 6 caractères'; return; }
        if (pwd1 !== pwd2) { errEl.textContent = 'Les mots de passe ne correspondent pas'; return; }
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.textContent = 'Changement en cours…';
        try {
          await confirmPasswordReset(auth, oobCode, pwd1);
          renderSuccess();
        } catch (e) {
          btn.disabled = false; btn.textContent = 'Changer mon mot de passe';
          if (e.code === 'auth/invalid-action-code') {
            renderAlreadyUsed();
          } else if (e.code === 'auth/weak-password') {
            errEl.textContent = 'Mot de passe trop faible (minimum 6 caractères).';
          } else {
            errEl.textContent = 'Erreur : ' + (e.message || e.code || e);
          }
        }
      };
    }

    (async () => {
      if (mode !== 'resetPassword' || !oobCode) {
        renderError('Ce lien est incomplet ou incorrect. Redemande un lien de réinitialisation depuis la page de connexion.');
        return;
      }
      try {
        const email = await verifyPasswordResetCode(auth, oobCode);
        renderForm(email);
      } catch (e) {
        renderAlreadyUsed();
      }
    })();
  </script>
</body>
</html>
